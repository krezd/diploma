version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: diploma-postgres
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: .
    container_name: diploma-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  pgdata:

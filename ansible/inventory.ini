# =============================================================================
# Inventory — список узлов кластера
# Добавляй compute-узлы в группу [compute], мастер всегда один
# =============================================================================

[master]
master ansible_host=10.100.192.111

[compute]
node01 ansible_host=192.168.0.19
# node02 ansible_host=192.168.0.20   # раскомментируй для добавления узла
# node03 ansible_host=192.168.0.21

# Группа всех узлов кластера (используется для munge, MPI, SLURM)
[cluster:children]
master
compute

# =============================================================================
# Общие параметры подключения
# =============================================================================
[all:vars]
ansible_user=your_user          # пользователь SSH (должен иметь sudo)
ansible_become=true             # использовать sudo
ansible_become_method=sudo
# ansible_ssh_private_key_file=~/.ssh/id_rsa   # путь к ключу, если нужен
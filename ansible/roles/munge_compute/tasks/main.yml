# =============================================================================
# Роль munge_compute — копирует ключ с мастера и запускает munge
# =============================================================================

- name: Скопировать munge.key на compute-узел
  copy:
    src: /tmp/munge.key        # был сохранён ролью munge_master
    dest: "{{ munge_key_path }}"
    owner: munge
    group: munge
    mode: '0400'
  notify: restart munge

- name: Включить и запустить munge
  systemd:
    name: munge
    enabled: true
    state: started
# =============================================================================
# Плейбук деплоя приложения (только бэкенд + фронтенд)
# Используй после сборки: cd backend && ./mvnw clean package -DskipTests
# Запуск: ansible-playbook -i inventory.ini playbook-deploy.yml
# =============================================================================
---
- name: Деплой бэкенда и фронтенда
  hosts: master
  gather_facts: true
  roles:
    - backend
    - docker